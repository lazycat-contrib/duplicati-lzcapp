version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: duplicati
build:
  toolchains: []
  run_buildscript: false
images:
  - id: duplicati
    target: service
    service: duplicati
    source: duplicati/duplicati
    channel: custom
    sort: semver
    tag_regex: '^2[.][0-9]+[.][0-9]+[.][0-9]+$'
    version_regex: '^(?P<version>2[.][0-9]+[.][0-9]+)[.][0-9]+$'
    version_template: '{version}'
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Duplicati
    skip_if_version_exists: true
