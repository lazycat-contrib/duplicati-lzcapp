application:
  subdomain: duplicati
  multi_instance: false
  # This app authenticates its own users, so it is exposed directly
  # instead of sitting behind the platform login gate.
  public_path:
    - /
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://duplicati:8200/

services:
  duplicati:
    # upstream: duplicati/duplicati:2.4.1.0
    image: docker.1ms.run/duplicati/duplicati:2.4.1.0
    environment:
      - TZ=Asia/Shanghai
      # The image's run-as-user script maps PUID/PGID to the persistent volume.
      - PUID=1000
      - PGID=1000
    binds:
      - /lzcapp/var/config:/data
      - /lzcapp/var/backups:/backups

usage: |
  Duplicati 是备份客户端：把文件做成加密的增量备份，存到网盘、SFTP、S3、WebDAV 等目标。

  使用方法：
  1. 打开应用，首次访问会问你「是否设置了密码」——首次请直接进入（不设密码），之后到设置里加访问密码。
  2. 点「新增备份」，选择要备份的目录（本包预置了 /backups 作为备份数据目录）和目标存储。
  3. 设定计划后即可自动备份；恢复时选备份集和时间点即可。

  数据与安全：
  - 备份任务配置和本地数据库保存在 /lzcapp/var/config，备份产物放在 /lzcapp/var/backups，卸载应用会一并删除，请提前确认远端副本。
  - 备份内容在客户端加密后再上传，加密口令由你设置，丢失无法恢复，请单独保管。
  - 本包不预置访问密码，首次进入后请尽快在设置里设置一个。
  - 应用直接对外开放，由应用自己的登录页鉴权：
    自带账号体系的服务再套一层平台鉴权会造成重复登录，所以用 public_path。

  说明：
  - 目标存储的账号密钥由你自行填写，本包不代为保管。
  - 未做真机验证：首次设置、备份执行、恢复演练、计划任务以及重启后持久化均未在设备上实测。
